# Render Infrastructure-as-Code Blueprint
# Automatically provisions a managed PostgreSQL database and a persistent Next.js Web Service
services:
  - type: web
    name: expense-tracker-pro
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: expense-tracker-db
    plan: free
    databaseName: expensetracker
    user: expensetracker_user
